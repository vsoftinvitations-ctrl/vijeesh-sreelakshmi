  <style>
    @font-face {
      font-family: 'Brittany Signature';
      src: url('/fonts/BrittanySignature.woff') format('woff'),
        url('fonts/BrittanySignature.woff') format('woff'),
        url('https://fonts.cdnfonts.com/s/39082/BrittanySignature-LjyZ.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --ivory: #faf6ee;
      --cream: #f3ece0;
      --blush: #f4e6e0;
      --gold: #b8985a;
      --gold-soft: #dcc9a0;
      --ink: #3b342b;
      --mute: #7d7365;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'DM Sans', system-ui, sans-serif;
      --script: 'Alex Brush', 'Great Vibes', cursive;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--ivory);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased
    }

    section {
      padding: clamp(72px, 14vw, 140px) 24px;
      text-align: center;
      position: relative
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto
    }

    .label {
      font-size: .7rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 400;
      margin: 0 0 28px
    }

    h1,
    h2,
    h3,
    .serif {
      font-family: var(--serif);
      font-weight: 400;
      margin: 0
    }

    .names {
      font-family: var(--script);
      font-weight: 400;
      font-size: clamp(3.2rem, 13vw, 5.2rem);
      line-height: 1.2;
      letter-spacing: .02em
    }

    .intro-names {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      position: relative;
      text-align: center;
      overflow: visible;
    }

    .script-line {
      position: relative;
      display: inline-block;
      line-height: 1.2;
      padding: 0.05em 0.8em;
      overflow: visible;
    }

    .script-text {
      display: inline-block;
      font-family: var(--script);
      font-size: clamp(3.2rem, 12.5vw, 5.2rem);
      font-weight: 400;
      color: var(--ink);
      letter-spacing: .02em;
      white-space: nowrap;
      padding: 0.08em 0.3em;
      margin: -0.08em -0.3em;
      overflow: visible;
      will-change: clip-path, opacity;
    }

    .script-groom .script-text,
    .script-bride .script-text {
      clip-path: inset(-60px 105% -60px -60px);
      opacity: 0;
    }

    .script-amp {
      overflow: visible;
    }

    .script-amp .amp {
      font-family: var(--serif);
      font-style: italic;
      color: var(--gold);
      font-size: clamp(1.6rem, 5.5vw, 2.3rem);
      opacity: 0;
      transform: scale(.6) rotate(-8deg);
      display: block;
      margin: 2px 0;
      transition: transform .6s ease;
    }

    .calligraphy-spark {
      position: absolute;
      top: 52%;
      left: 0;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px 2px #fff2a8, 0 0 16px 4px rgba(235, 205, 130, .95), 0 0 24px 6px rgba(212, 175, 55, .85);
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%);
      will-change: left, opacity;
    }

    .flourish-wrap {
      width: clamp(200px, 62vw, 300px);
      height: 24px;
      margin: .1rem auto 0;
      overflow: visible;
    }

    .calligraphy-flourish {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .flourish-path {
      stroke-dasharray: 320;
      stroke-dashoffset: 320;
    }

    .intro-names.in .script-groom .script-text {
      animation: writeGroom 1.7s cubic-bezier(.35, 0, .25, 1) .3s forwards;
    }

    .intro-names.in .script-groom .calligraphy-spark {
      animation: sparkMoveGroom 1.7s cubic-bezier(.35, 0, .25, 1) .3s forwards;
    }

    .intro-names.in .script-amp .amp {
      animation: revealAmp .7s cubic-bezier(.34, 1.56, .64, 1) 1.8s forwards;
    }

    .intro-names.in .script-bride .script-text {
      animation: writeBride 1.5s cubic-bezier(.35, 0, .25, 1) 2.3s forwards;
    }

    .intro-names.in .script-bride .calligraphy-spark {
      animation: sparkMoveBride 1.5s cubic-bezier(.35, 0, .25, 1) 2.3s forwards;
    }

    .intro-names.in .flourish-path {
      animation: drawFlourish 1.1s cubic-bezier(.25, 1, .5, 1) 3.6s forwards;
    }

    @keyframes writeGroom {
      0% {
        clip-path: inset(-60px 105% -60px -60px);
        opacity: 1;
      }

      100% {
        clip-path: inset(-60px -60px -60px -60px);
        opacity: 1;
      }
    }

    @keyframes sparkMoveGroom {
      0% {
        left: 0%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.4);
      }

      6% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }

      92% {
        left: 100%;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }

      100% {
        left: 100%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.2);
      }
    }

    @keyframes revealAmp {
      0% {
        opacity: 0;
        transform: scale(.6) rotate(-8deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes writeBride {
      0% {
        clip-path: inset(-60px 105% -60px -60px);
        opacity: 1;
      }

      100% {
        clip-path: inset(-60px -60px -60px -60px);
        opacity: 1;
      }
    }

    @keyframes sparkMoveBride {
      0% {
        left: 0%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.4);
      }

      6% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }

      92% {
        left: 100%;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }

      100% {
        left: 100%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.2);
      }
    }

    @keyframes drawFlourish {
      0% {
        stroke-dashoffset: 320;
      }

      100% {
        stroke-dashoffset: 0;
      }
    }

    @media(prefers-reduced-motion:reduce) {

      .script-groom .script-text,
      .script-bride .script-text {
        clip-path: none !important;
        opacity: 1 !important;
        animation: none !important;
      }

      .script-amp .amp {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
      }

      .calligraphy-spark {
        display: none !important;
      }

      .flourish-path {
        stroke-dashoffset: 0 !important;
        animation: none !important;
      }
    }

    .amp {
      font-family: var(--serif);
      font-style: italic;
      color: var(--gold);
      font-size: clamp(1.5rem, 5vw, 2rem);
      display: block;

    }

    .big {

    }

    .quote {

    .body {

      font-size: clamp(1.25rem, 4.4vw, 1.5rem);
      line-height: 1.7;
      max-width: 34ch;
      margin: 0 auto

    .small {
      font-size: .85rem;

    .alt {

    .rule {

    .orn {

      color: var(--gold)
    }

    /* hero with full image */
    #hero {
      position: fixed;
      inset: 0;
      z-index: 20;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: clamp(20px, 4svh, 44px) 20px;
      overflow: hidden;
      background: #0d0b09;
      transition: opacity .9s cubic-bezier(0.4, 0, 0.2, 1), transform .9s cubic-bezier(0.4, 0, 0.2, 1), visibility .9s;
    }

    #hero.leaving {
      opacity: 0;
      transform: scale(1.05);
      visibility: hidden;
      pointer-events: none;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    .hero-bg img {
      display: block;
      width: 100%;
      height: 100%;

      object-position: center 22%;
      animation: heroZoom 16s ease-out infinite alternate;
    }

    @keyframes heroZoom {
      0% { transform: scale(1); }
      100% { transform: scale(1.06); }
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(
        180deg,
        rgba(10, 8, 6, 0.58) 0%,
        rgba(10, 8, 6, 0.12) 25%,
        rgba(10, 8, 6, 0.22) 55%,

    .hero-border {

    .hero-border-inner {

    .hero-top {
      position: relative;

    .hero-monogram {

    .hero-invitation-label {

    .hero-bottom {

    }

    .hero-names {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(2.3rem, 8.5vw, 3.8rem);

    .hero-names .amp {

    .hero-date {

    .hero-venue {

    .hero-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, rgba(223, 194, 141, 0.95), rgba(184, 152, 90, 0.95));

    .hero-btn:hover {
      transform: scale(1.04);
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 25px rgba(255, 255, 255, 0.5);

    @keyframes pulseGlow {
      0%, 100% {

    .mono {
      width: 64px;

    }

    }

    }

    /* hero styles unified above */

        /* Married Card Section (Matching reference design) */
    .married-section {
      padding: clamp(60px, 9vh, 110px) 20px;
      background: radial-gradient(circle at 50% 50%, #fffdfa 0%, var(--ivory) 100%);
      position: relative;
    }

    .married-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #ffffff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.09), 0 4px 18px rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(220, 190, 140, 0.28);
      margin: 0 auto clamp(28px, 5vh, 44px);
      max-width: 890px;
      min-height: 440px;
      transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.8s ease;
    }

    /* Married Section Smooth Crossfade */
    .married-slider {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 420px;
      overflow: hidden;
      background: #f4ede3;
      cursor: pointer;
      user-select: none;
    }

    .married-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      z-index: 1;
      pointer-events: none;
      transition: opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: opacity;
    }

    /* Outgoing slide remains solid underneath during transition */
    .married-slide.prev {
      opacity: 1;
      z-index: 2;
      transition: none;
    }

    /* Incoming slide fades in on top smoothly */
    .married-slide.active {
      opacity: 1;
      z-index: 3;
      pointer-events: auto;
      transition: opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .married-slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      transform: scale(1.03);
      transition: transform 6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .married-slide.active img {
      transform: scale(1);
    }

    .married-details {
      background: #ffffff;
      padding: clamp(36px, 6vw, 64px) clamp(24px, 4vw, 48px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

    /* cover */
    #intro {
      padding-top: 0;
      padding-left: 0;

    }

      max-width: 640px;

    .cover img {

    /* Our Story Section */
    .story-section {

      position: relative;

      position: relative;
      width: 100%;
      margin: 0 auto;
      border-radius: 20px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 16px 45px -8px rgba(59, 52, 43, 0.12), 0 0 0 1px rgba(220, 201, 160, 0.45);
      cursor: pointer;
    }

    .story-slides-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
      background: #1e1b18;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }

    .story-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      z-index: 1;
      pointer-events: none;
      transition: opacity 1.6s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: opacity;
    }

    /* Outgoing slide remains solid underneath during transition */
    .story-slide.prev {
      opacity: 1;
      z-index: 2;
      transition: none;
    }

    /* Incoming slide fades in on top smoothly */
    .story-slide.active {
      opacity: 1;
      z-index: 3;
      pointer-events: auto;
      transition: opacity 1.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .story-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 14px;
      transform: scale(1.025);
      transition: transform 6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .story-slide.active img {
      transform: scale(1);
    }

    @media (max-width: 600px) {

        padding: 6px;
        border-radius: 16px;
      }

    .seq {
      opacity: 0;
      transform: translateY(12px) scale(.98);
      animation: seq .6s ease forwards;
      animation-delay: calc(var(--i)*.16s + .05s)
    }

    @keyframes seq {
      to {
        opacity: 1;
        transform: none
      }
    }

    /* reveal */
    .r {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 1s ease, transform 1s ease
    }

    .r.in {
      opacity: 1;
      transform: none
    }

    .line-x {
      transform: scaleX(0);
      transition: transform 1.1s ease
    }

    }

  <p class="note r">${D.full} • ${D.day}</p>
</div></section>

<section class="receptions-section" id="receptions"><div class="wrap" style="max-width:660px">
  <p class="label r" style="margin-bottom:8px">Celebrations</p>
  <h2 class="big r" style="font-size:clamp(1.6rem,4.5vw,2.1rem);margin-bottom:22px">The Receptions</h2>

  <div class="reception-grid">
    ${W.receptions.map(r => `
      <div class="reception-card r">
        <div>
          <div class="reception-badge">${r.side}</div>
          <h3 class="reception-title">${r.title}</h3>
          <div class="reception-gold-rule"></div>

          <div class="reception-details">
            <div class="reception-row">
              <span class="rec-icon-sm" aria-hidden="true">${calIcon}</span>
              <div>
                <span class="reception-date-val">${r.date}</span>
                <span class="reception-day-sub">(${r.day})</span>
              </div>
            </div>

            <div class="reception-row">
              <span class="rec-icon-sm" aria-hidden="true">${clockIcon}</span>
              <span class="reception-time-val">${r.time}</span>
            </div>

            <div class="reception-row" style="align-items:flex-start">
              <span class="rec-icon-sm" style="margin-top:2px" aria-hidden="true">${r.isHome ? homeIcon : pin}</span>
              <div class="reception-loc-col">
                <span class="reception-loc-name">${r.location}</span>
                <span class="reception-loc-addr">${r.address}</span>
              </div>
            </div>
          </div>
        </div>

        ${r.map ? `
          <div class="reception-action">
            <a class="reception-btn-sm" href="${r.map}" target="_blank" rel="noopener noreferrer">
              ${pin}
              <span>View Map</span>
            </a>
          </div>
        ` : ''}
      </div>
    `).join('')}
  </div>
</div></section>

<section class="alt"><div class="wrap">
  ${orn}
  <p class="body r">${W.invite}</p>
  ${orn}
</div></section>

<section><div class="wrap" style="max-width:900px">
  <p class="label r">With the blessings of our families</p>
  <div class="fam">
    ${fam(W.families[0])}
    <div class="sep line-x"></div>
    ${fam(W.families[1])}
  </div>
</div></section>

<section style="background:linear-gradient(180deg,var(--ivory),var(--blush) 55%,var(--ivory))"><div class="wrap">
  <div class="rule line-x r" style="margin-top:0"></div>
  <p class="quote r">“${W.quotes[1]}”</p>
  <div class="rule line-x r"></div>
</div></section>

<section class="story-section" id="our-story">
  <div class="wrap" style="max-width:780px">
    <p class="label r">Our Story</p>
    <h2 class="names r" style="font-size:clamp(2.4rem,8.5vw,3.6rem);line-height:1.2;margin-bottom:8px">Every Moment Led to You</h2>
    <p class="serif r" style="font-size:1.15rem;color:var(--gold,#b8985a);letter-spacing:0.08em;margin-bottom:28px">A glimpse into our beautiful journey</p>
    
    <div class="story-card r" id="storyContainer">
      <div class="story-slides-wrap" id="storySlidesWrap" role="region" aria-label="Our Love Story Slideshow" title="Tap to view next photo">
        ${[1,2,3,4,5,6,7,8,9].map((n, i) => `
          <div class="story-slide ${i === 0 ? 'active' : ''}" data-index="${i}">
            <img src="/pic${n}.webp" alt="Our Story - Chapter ${n}" loading="${i < 2 ? 'eager' : 'lazy'}" decoding="async">
          </div>
        `).join('')}
      </div>
    </div>
  </div>
</section>

${W.compliments && W.compliments.length ? `
<section><div class="wrap">
  <p class="label r">Best compliments from</p>
  <div class="comp r">${W.compliments.map(n => `<span>${n}</span>`).join('')}</div>
</div></section>` : ''}

<section style="padding-block:clamp(100px,22vw,200px)"><div class="wrap">
  <h2 class="names r" style="font-size:clamp(2.2rem,9vw,3.4rem)">${W.short}</h2>
  <p class="serif r" style="font-size:1.4rem;letter-spacing:.2em;margin-top:24px">${D.dots}</p>
  <div class="rule line-x r"></div>
  <p class="quote r">Together, forever begins here.</p>
  <p class="small r" style="margin-top:28px">With love and blessings</p>
  ${orn}
</div></section>`;

    function fam(f) {
      const linesHtml = f.lines && f.lines.length ? `<p style="margin-top:6px">${f.lines.join('<br>')}</p>` : '';
      return `<div class="r">
  <p class="label">${f.title}</p>
  <h3 style="font-size:clamp(1.3rem,4.5vw,1.75rem);line-height:1.4">${f.names}</h3>
  ${linesHtml}
</div>`;
    }
    document.getElementById('fmono').textContent = W.footMono;
    document.getElementById('fdate').textContent = D.dotted;

    /* ===== Scroll reveal ===== */
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) } }), { threshold: .15, rootMargin: '0px 0px -6% 0px' });

    /* ===== Prelude: guest taps Open Invitation to enter ===== */
    history.scrollRestoration = 'manual'; scrollTo(0, 0);
    document.documentElement.style.overflow = 'hidden'; document.body.style.overflow = 'hidden';
    let opened = false;
    function openInvite() {
      if (opened) return; opened = true;
      document.documentElement.style.overflow = ''; document.body.style.overflow = '';
      scrollTo(0, 0);
      document.getElementById('hero').classList.add('leaving');
      document.querySelectorAll('.r').forEach(el => io.observe(el));
      playAudio();
      setTimeout(() => {
        const inames = document.querySelector('.intro-names');
        if (inames) inames.classList.add('in');
      }, 450);
    }
    document.querySelector('#hero .btn').addEventListener('click', e => { e.preventDefault(); openInvite() });

    /* ===== Married Section Smooth Crossfade Slideshow ===== */
    function initSlider() {
      const slider = document.getElementById('marriedSlider');
      if (!slider) return;
      const slides = slider.querySelectorAll('.married-slide');
      const total = slides.length;
      if (total <= 1) return;

      let current = 0;
      let isTransitioning = false;
      let timer = null;
      const displayDuration = 5000;
      const fadeDuration = 1800;

      // Initialize first slide
      slides.forEach((s, i) => {
        if (i === 0) {
          s.classList.add('active');
          s.classList.remove('prev');
        } else {
          s.classList.remove('active', 'prev');
        }
      });

      function goTo(nextIdx) {
        if (nextIdx === current || isTransitioning) return;
        isTransitioning = true;

        const prevSlide = slides[current];
        const nextSlide = slides[nextIdx];

        // 1. Keep outgoing slide solid underneath (z-index: 2)
        slides.forEach(s => s.classList.remove('prev'));
        prevSlide.classList.add('prev');
        prevSlide.classList.remove('active');

        // 2. Prepare incoming slide on top at opacity 0 (z-index: 3)
        nextSlide.classList.remove('active');
        void nextSlide.offsetWidth;

        // 3. Fade in incoming slide smoothly over previous slide
        nextSlide.classList.add('active');
        current = nextIdx;

        // 4. Release transition lock after crossfade completes
        setTimeout(() => {
          prevSlide.classList.remove('prev');
          isTransitioning = false;
        }, fadeDuration);
      }

      function next() {
        goTo((current + 1) % total);
      }

      function startAuto() {
        stopAuto();
        timer = setInterval(next, displayDuration);
      }

      function stopAuto() {
        if (timer) clearInterval(timer);
      }

      slider.addEventListener('click', () => {
        next();
        startAuto();
      });

      slider.addEventListener('mouseenter', stopAuto);
      slider.addEventListener('mouseleave', startAuto);

      startAuto();
    }
    initSlider();

    /* ===== Our Story Smooth Crossfade Slideshow ===== */
    function initStory() {
      const wrap = document.getElementById('storySlidesWrap');
      if (!wrap) return;

      const slides = wrap.querySelectorAll('.story-slide');
      const total = slides.length;
      if (total <= 1) return;

      let current = 0;
      let isTransitioning = false;
      let timer = null;
      const displayDuration = 4500;
      const fadeDuration = 1600;

      // Initialize first slide
      slides.forEach((s, i) => {
        if (i === 0) {
          s.classList.add('active');
        } else {
          s.classList.remove('active', 'prev');
        }
      });

      function goTo(nextIdx) {
        if (nextIdx === current || isTransitioning) return;
        isTransitioning = true;

        const prevSlide = slides[current];
        const nextSlide = slides[nextIdx];

        // 1. Keep outgoing slide solid underneath (z-index: 2)
        slides.forEach(s => s.classList.remove('prev'));
        prevSlide.classList.add('prev');
        prevSlide.classList.remove('active');

        // 2. Prepare incoming slide on top at opacity 0 (z-index: 3)
        nextSlide.classList.remove('active');
        void nextSlide.offsetWidth;

        // 3. Fade in incoming slide smoothly over previous slide
        nextSlide.classList.add('active');
        current = nextIdx;

        // 4. Release transition lock after crossfade completes
        setTimeout(() => {
          prevSlide.classList.remove('prev');
          isTransitioning = false;
        }, fadeDuration);
      }

      function next() {
        goTo((current + 1) % total);
      }

      function prev() {
        goTo((current - 1 + total) % total);
      }

      function startAuto() {
        stopAuto();
        timer = setInterval(next, displayDuration);
      }

      function stopAuto() {
        if (timer) clearInterval(timer);
      }

      wrap.addEventListener('click', () => {
        next();
        startAuto();
      });

      let touchStartX = 0;
      let touchStartY = 0;
      wrap.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].clientX;
        touchStartY = e.changedTouches[0].clientY;
      }, { passive: true });

      wrap.addEventListener('touchend', (e) => {
        const diffX = e.changedTouches[0].clientX - touchStartX;
        const diffY = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY)) {
          if (diffX < 0) next();
          else prev();
          startAuto();
        }
      }, { passive: true });

      const container = document.getElementById('storyContainer');
      if (container) {
        container.addEventListener('mouseenter', stopAuto);
        container.addEventListener('mouseleave', startAuto);
      }

      startAuto();
    }
    initStory();

    /* ===== Wedding Countdown Timer ===== */
    function initCountdown() {
      const target = new Date('2026-12-10T11:52:00+05:30').getTime();
      const elDays = document.getElementById('cd-days');
      const elHours = document.getElementById('cd-hours');
      const elMins = document.getElementById('cd-minutes');
      const elSecs = document.getElementById('cd-seconds');
      if (!elDays || !elHours || !elMins || !elSecs) return;

      function update() {
        const now = Date.now();
        const diff = Math.max(0, target - now);

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((diff % (1000 * 60)) / 1000);

        elDays.textContent = String(days).padStart(2, '0');
        elHours.textContent = String(hours).padStart(2, '0');
        elMins.textContent = String(mins).padStart(2, '0');
        elSecs.textContent = String(secs).padStart(2, '0');
      }

      update();
      setInterval(update, 1000);
    }
    initCountdown();

    /* ===== Background Music Playback ===== */
    const audio = document.getElementById('wedding-audio');
    if (audio) audio.volume = 0.4;

    function playAudio() {
      if (!audio) return;
      audio.volume = 0.4;
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch(err => {
          console.log("Audio waiting for user gesture:", err);
          const resume = () => {
            audio.play().catch(() => { });
            window.removeEventListener('click', resume);
            window.removeEventListener('touchstart', resume);
          };
          window.addEventListener('click', resume, { once: true });
          window.addEventListener('touchstart', resume, { once: true });
        });
      }
    }
  </script>
</body>

</html>
