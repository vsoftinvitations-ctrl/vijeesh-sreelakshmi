  <style>
    @font-face {
      font-family: 'Brittany Signature';
      src: url('/fonts/BrittanySignature.woff') format('woff'),
        url('fonts/BrittanySignature.woff') format('woff'),
        url('https://fonts.cdnfonts.com/s/39082/BrittanySignature-LjyZ.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --ivory: #faf6ee;
      --cream: #f3ece0;
      --blush: #f4e6e0;
      --gold: #b8985a;
      --gold-soft: #dcc9a0;
      --ink: #3b342b;
      --mute: #7d7365;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'DM Sans', system-ui, sans-serif;
      --script: 'Alex Brush', 'Great Vibes', cursive;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--ivory);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased
    }

    section {
      padding: clamp(72px, 14vw, 140px) 24px;
      text-align: center;
      position: relative
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto
    }

    .label {
      font-size: .7rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 400;
      margin: 0 0 28px
    }

    h1,
    h2,
    h3,
    .serif {
      font-family: var(--serif);
      font-weight: 400;
      margin: 0
    }

    .names {
      font-family: var(--script);
      font-weight: 400;
      font-size: clamp(3.2rem, 13vw, 5.2rem);
      line-height: 1.2;
      letter-spacing: .02em
    }

    .intro-names {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      position: relative;
      text-align: center;
      overflow: visible;
    }

    .script-line {
      position: relative;
      display: inline-block;
      line-height: 1.2;
      padding: 0.05em 0.8em;
      overflow: visible;
    }

    .script-text {
      display: inline-block;
      font-family: var(--script);
      font-size: clamp(3.2rem, 12.5vw, 5.2rem);
      font-weight: 400;
      color: var(--ink);
      letter-spacing: .02em;
      white-space: nowrap;
      padding: 0.08em 0.3em;
      margin: -0.08em -0.3em;
      overflow: visible;
      will-change: clip-path, opacity;
    }

    .script-groom .script-text,
    .script-bride .script-text {
      clip-path: inset(-60px 105% -60px -60px);
      opacity: 0;
    }

    .script-amp {
      overflow: visible;
    }

    .script-amp .amp {
      font-family: var(--serif);
      font-style: italic;
      color: var(--gold);
      font-size: clamp(1.6rem, 5.5vw, 2.3rem);
      opacity: 0;
      transform: scale(.6) rotate(-8deg);
      display: block;
      margin: 2px 0;
      transition: transform .6s ease;
    }

    .calligraphy-spark {
      position: absolute;
      top: 52%;
      left: 0;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px 2px #fff2a8, 0 0 16px 4px rgba(235, 205, 130, .95), 0 0 24px 6px rgba(212, 175, 55, .85);
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -50%);
      will-change: left, opacity;
    }

    .flourish-wrap {
      width: clamp(200px, 62vw, 300px);
      height: 24px;
      margin: .1rem auto 0;
      overflow: visible;
    }

    .calligraphy-flourish {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .flourish-path {
      stroke-dasharray: 320;
      stroke-dashoffset: 320;
    }

    .intro-names.in .script-groom .script-text {
      animation: writeGroom 1.7s cubic-bezier(.35, 0, .25, 1) .3s forwards;
    }

    .intro-names.in .script-groom .calligraphy-spark {
      animation: sparkMoveGroom 1.7s cubic-bezier(.35, 0, .25, 1) .3s forwards;
    }

    .intro-names.in .script-amp .amp {
      animation: revealAmp .7s cubic-bezier(.34, 1.56, .64, 1) 1.8s forwards;
    }

    .intro-names.in .script-bride .script-text {
      animation: writeBride 1.5s cubic-bezier(.35, 0, .25, 1) 2.3s forwards;
    }

    .intro-names.in .script-bride .calligraphy-spark {
      animation: sparkMoveBride 1.5s cubic-bezier(.35, 0, .25, 1) 2.3s forwards;
    }

    .intro-names.in .flourish-path {
      animation: drawFlourish 1.1s cubic-bezier(.25, 1, .5, 1) 3.6s forwards;
    }

    @keyframes writeGroom {
      0% {
        clip-path: inset(-60px 105% -60px -60px);
        opacity: 1;
      }

      100% {
        clip-path: inset(-60px -60px -60px -60px);
        opacity: 1;
      }
    }

    @keyframes sparkMoveGroom {
      0% {
        left: 0%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.4);
      }

      6% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }

      92% {
        left: 100%;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }

      100% {
        left: 100%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.2);
      }
    }

    @keyframes revealAmp {
      0% {
        opacity: 0;
        transform: scale(.6) rotate(-8deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes writeBride {
      0% {
        clip-path: inset(-60px 105% -60px -60px);
        opacity: 1;
      }

      100% {
        clip-path: inset(-60px -60px -60px -60px);
        opacity: 1;
      }
    }

    @keyframes sparkMoveBride {
      0% {
        left: 0%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.4);
      }

      6% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }

      92% {
        left: 100%;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }

      100% {
        left: 100%;
        opacity: 0;
        transform: translate(-50%, -50%) scale(.2);
      }
    }

    @keyframes drawFlourish {
      0% {
        stroke-dashoffset: 320;
      }

      100% {
        stroke-dashoffset: 0;
      }
    }

    @media(prefers-reduced-motion:reduce) {

      .script-groom .script-text,
      .script-bride .script-text {
        clip-path: none !important;
        opacity: 1 !important;
        animation: none !important;
      }

      .script-amp .amp {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
      }

      .calligraphy-spark {
        display: none !important;
      }

      .flourish-path {
        stroke-dashoffset: 0 !important;
        animation: none !important;
      }
    }

    .amp {
      font-family: var(--serif);
      font-style: italic;
      color: var(--gold);
      font-size: clamp(1.5rem, 5vw, 2rem);
      display: block;
      margin: 6px 0
    }

    .big {
      font-size: clamp(2.3rem, 7vw, 3.2rem);
      line-height: 1.15
    }

    .quote {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(1.3rem, 4.6vw, 1.65rem);
      line-height: 1.6;
      max-width: 30ch;
      margin: 0 auto
    }

    .body {
      font-family: var(--serif);
      font-size: clamp(1.25rem, 4.4vw, 1.5rem);
      line-height: 1.7;
      max-width: 34ch;
      margin: 0 auto
    }

    .small {
      font-size: .85rem;
      color: var(--mute);
      letter-spacing: .04em
    }

    .alt {
      background: var(--cream)
    }

    .rule {
      height: 1px;
      width: 64px;
      background: var(--gold);
      margin: 36px auto
    }

    .orn {
      display: block;
      margin: 36px auto;
      width: 150px;
      height: 18px;
      color: var(--gold)
    }

    /* hero with full image */
    #hero {
      position: fixed;
      inset: 0;
      z-index: 20;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: clamp(20px, 4svh, 44px) 20px;
      overflow: hidden;
      background: #0d0b09;
      transition: opacity .9s cubic-bezier(0.4, 0, 0.2, 1), transform .9s cubic-bezier(0.4, 0, 0.2, 1), visibility .9s;
    }

    #hero.leaving {
      opacity: 0;
      transform: scale(1.05);
      visibility: hidden;
      pointer-events: none;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    .hero-bg img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 22%;
      animation: heroZoom 16s ease-out infinite alternate;
    }

    @keyframes heroZoom {
      0% { transform: scale(1); }
      100% { transform: scale(1.06); }
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(
        180deg,
        rgba(10, 8, 6, 0.58) 0%,
        rgba(10, 8, 6, 0.12) 25%,
        rgba(10, 8, 6, 0.22) 55%,
        rgba(10, 8, 6, 0.72) 78%,
        rgba(10, 8, 6, 0.94) 100%
      );
      pointer-events: none;
    }

    .hero-border {
      position: absolute;
      inset: 14px;
      border: 1px solid rgba(223, 194, 141, 0.35);
      border-radius: 4px;
      pointer-events: none;
      z-index: 3;
    }

    .hero-border-inner {
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(223, 194, 141, 0.15);
      border-radius: 2px;
      pointer-events: none;
      z-index: 3;
    }

    .hero-top {
      position: relative;
      z-index: 4;
      text-align: center;
      margin-top: clamp(6px, 1.5svh, 16px);
    }

    .hero-monogram {
      display: inline-block;
      font-family: var(--serif);
      font-size: 1.05rem;
      letter-spacing: .28em;
      color: #dfc28d;
      padding: 6px 18px;
      border: 1px solid rgba(223, 194, 141, 0.5);
      border-radius: 999px;
      background: rgba(10, 8, 6, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      margin-bottom: 6px;
    }

    .hero-invitation-label {
      font-family: var(--sans);
      font-size: 0.72rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.88);
      margin-top: 4px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    .hero-bottom {
      position: relative;
      z-index: 4;
      text-align: center;
      width: 100%;
      max-width: 520px;
      margin-bottom: clamp(10px, 2svh, 24px);
    }

    .hero-names {
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(2.3rem, 8.5vw, 3.8rem);
      line-height: 1.1;
      letter-spacing: .08em;
      color: #ffffff;
      text-transform: none;
      text-shadow: 0 3px 18px rgba(0, 0, 0, 0.85);
      margin-bottom: 8px;
    }

    .hero-names .amp {
      font-family: var(--serif);
      font-style: italic;
      color: #dfc28d;
      margin: 0 8px;
      font-size: 0.9em;
    }

    .hero-date {
      font-family: var(--sans);
      font-size: clamp(0.85rem, 2.5vw, 1.05rem);
      letter-spacing: .22em;
      text-transform: uppercase;
      color: #dfc28d;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      margin-bottom: 4px;
    }

    .hero-venue {
      font-family: var(--sans);
      font-size: 0.82rem;
      letter-spacing: .15em;
      color: rgba(255, 255, 255, 0.82);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      margin-bottom: clamp(14px, 3svh, 24px);
    }

    .hero-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, rgba(223, 194, 141, 0.95), rgba(184, 152, 90, 0.95));
      color: #1a140d !important;
      font-family: var(--sans);
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: .28em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 16px 38px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 20px rgba(223, 194, 141, 0.35);
      border: 1px solid #dfc28d;
      cursor: pointer;
      transition: transform .3s ease, box-shadow .3s ease, background .3s ease;
      animation: pulseGlow 2.5s infinite;
    }

    .hero-btn:hover {
      transform: scale(1.04);
      background: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 25px rgba(255, 255, 255, 0.5);
    }

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 16px rgba(223, 194, 141, 0.3);
      }
      50% {
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5), 0 0 28px rgba(223, 194, 141, 0.6);
      }
    }

    .mono {
      width: 64px;
      height: 64px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--serif);
      font-size: 1.05rem;
      letter-spacing: .2em;
      color: var(--gold);
      margin-bottom: 34px;
      padding-left: .2em
    }

    .date {
      font-family: var(--serif);
      font-size: 1.5rem;
      letter-spacing: .14em;
      margin-top: 34px
    }

    .day {
      font-size: .7rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--mute);
      margin-top: 2px
    }

    .tag {
      margin: 28px 0 38px;
      color: var(--mute);
      font-size: .9rem
    }

    .btn {
      display: inline-block;
      background: var(--ivory);
      color: var(--ink);
      border: 1px solid var(--gold);
      border-radius: 999px;
      padding: 14px 34px;
      font: 400 .72rem var(--sans);
      letter-spacing: .28em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      min-height: 44px;
      transition: transform .35s ease, background .35s ease, border-color .35s ease
    }

    .btn:hover {
      background: #fff;
      transform: scale(1.03);
      border-color: var(--ink)
    }

    .btn:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px
    }

    /* hero styles unified above */

        /* Married Card Section (Matching reference design) */
    .married-section {
      padding: clamp(60px, 9vh, 110px) 20px;
      background: radial-gradient(circle at 50% 50%, #fffdfa 0%, var(--ivory) 100%);
      position: relative;
    }

    .married-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #ffffff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.09), 0 4px 18px rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(220, 190, 140, 0.28);
      margin: 0 auto clamp(28px, 5vh, 44px);
      max-width: 890px;
      min-height: 440px;
      transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.8s ease;
    }

    /* Normal Smooth Photo Transition */
    .married-slider {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 420px;
      overflow: hidden;
      background: #f4ede3;
      cursor: pointer;
      user-select: none;
    }

    .married-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transform: scale(1.03);
      transition: opacity 2.2s cubic-bezier(0.4, 0, 0.2, 1), transform 3s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 1;
      pointer-events: none;
      will-change: opacity, transform;
    }

    .married-slide.active {
      opacity: 1;
      transform: scale(1);
      z-index: 2;
      pointer-events: auto;
    }

    .married-slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
    }

    .married-details {
      background: #ffffff;
      padding: clamp(36px, 6vw, 64px) clamp(24px, 4vw, 48px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .married-label {
      font-family: var(--sans);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #b8985a;
      margin-bottom: clamp(16px, 3vh, 26px);
    }

    .married-name {
      font-family: 'Cormorant Garamond', Didot, 'Playfair Display', serif;
      font-size: clamp(2.1rem, 4.4vw, 3rem);
      font-weight: 400;
      line-height: 1.15;
      color: #24201e;
      letter-spacing: 0.02em;
      margin: 0;
      text-transform: capitalize;
    }

    .married-amp {
      font-family: 'Cormorant Garamond', Didot, serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1.8rem, 3.4vw, 2.4rem);
      color: #c49a53;
      line-height: 1;
      margin: 6px 0 8px;
      display: block;
    }

    @media (max-width: 680px) {
      .married-card {
        grid-template-columns: 1fr;
        max-width: 440px;
        min-height: auto;
      }

      .married-slider {
        min-height: 330px;
        height: 350px;
      }

      .married-details {
        padding: 34px 24px 38px;
      }

    /* cover */
    #intro {
      padding-top: 0;
      padding-left: 0;
      padding-right: 0;
      overflow-x: hidden;
    }

    #intro .wrap {
      padding-left: 24px;
      padding-right: 24px;
    }

    .cover {
      width: 100%;
      max-width: 640px;
      margin: 0 auto -44px;
      aspect-ratio: 3/4;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, #000 68%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 68%, transparent 100%);
    }

    .cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 28%;
      transform: scale(1.03);
      transition: transform 2.6s ease;
    }

    .cover.in img {
      transform: none
    }

    @media (min-width: 768px) {
      .cover {
        max-width: 100%;
        width: 100%;
        height: 88vh;
        min-height: 620px;
        max-height: 960px;
        aspect-ratio: auto;
        margin: 0 auto -70px;
        -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent 100%);
        mask-image: linear-gradient(to bottom, #000 70%, transparent 100%);
      }

      .cover img {
        object-position: center 24%;
      }

      #intro .wrap {
        max-width: 820px;
      }
    }

    @media(prefers-reduced-motion:reduce) {
      .cover img {
        transition: none;
        transform: none
      }
    }

    /* gallery */
    .gal {
      position: relative;
      max-width: 500px;
      margin: 0 auto;
      padding-bottom: 26%;
      text-align: left
    }

    .ph {
      overflow: hidden;
      border-radius: 6px;
      box-shadow: 0 8px 28px rgba(60, 50, 30, .12);
      background: var(--cream)
    }

    .ph img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.03);
      transition: transform 2.6s ease
    }

    .in.ph img,
    .in .ph img {
      transform: none
    }

    .ga {
      width: 80%;
      aspect-ratio: 4/5
    }

    .ga img {
      object-position: 50% 28%
    }

    .gb {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 54%;
      aspect-ratio: 3/4;
      border: 6px solid var(--ivory)
    }

    .gb img {
      object-position: 50% 36%
    }

    @media(prefers-reduced-motion:reduce) {
      .ph img {
        transition: none;
        transform: none
      }
    }

    /* hero sequence */
    .seq {
      opacity: 0;
      transform: translateY(12px) scale(.98);
      animation: seq .6s ease forwards;
      animation-delay: calc(var(--i)*.16s + .05s)
    }

    @keyframes seq {
      to {
        opacity: 1;
        transform: none
      }
    }

    /* reveal */
    .r {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 1s ease, transform 1s ease
    }

    .r.in {
      opacity: 1;
      transform: none
    }

    .line-x {
      transform: scaleX(0);
      transition: transform 1.1s ease
    }

    .in .line-x,
    .line-x.in {
      transform: scaleX(1)
    }

    /* date */
    .daynum {
      font-family: var(--serif);
      font-size: clamp(6rem, 30vw, 10rem);
      line-height: .9;
      font-weight: 300;
      color: var(--ink)
    }

    .month {
      font-family: var(--serif);
      font-size: 1.5rem;
      letter-spacing: .3em;
      margin-top: 8px;
      padding-left: .3em
    }

    .time {
      font-family: var(--serif);
      font-size: 1.6rem;
      margin-top: 8px
    }

    /* Countdown Timer */
    .countdown-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(8px, 2.5vw, 18px);
      margin: clamp(26px, 4.5vh, 38px) auto 0;
      max-width: 440px;
      padding: clamp(14px, 2.5vh, 20px) clamp(16px, 4vw, 28px);
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 16px;
      border: 1px solid rgba(220, 194, 141, 0.38);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
    }

    .countdown-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: clamp(48px, 11vw, 64px);
    }

    .countdown-num {
      font-family: 'Cormorant Garamond', Didot, 'Playfair Display', serif;
      font-size: clamp(1.9rem, 5.5vw, 2.6rem);
      font-weight: 400;
      color: #24201e;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .countdown-unit {
      font-family: var(--sans);
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #b8985a;
      margin-top: 6px;
      font-weight: 500;
    }

    .countdown-sep {
      font-family: 'Cormorant Garamond', Didot, serif;
      font-size: clamp(1.5rem, 3.8vw, 2rem);
      color: #dfc28d;
      margin-top: -12px;
      font-weight: 300;
    }

    .pin {
      width: 22px;
      height: 22px;
      color: var(--gold);
      margin-bottom: 18px
    }

    .note {
      font-family: var(--serif);
      font-style: italic;
      color: var(--mute);
      font-size: 1.15rem;
      margin-top: 22px
    }

    /* families */
    .fam {
      display: grid;
      gap: 56px;
      max-width: 860px;
      margin: 56px auto 0
    }

    .fam h3 {
      font-size: 1.6rem;
      line-height: 1.3;
      margin: 0 0 14px
    }

    .fam .label {
      margin-bottom: 18px
    }

    .fam p {
      margin: 0;
      color: var(--mute);
      font-size: .95rem
    }

    .fam .sep {
      width: 1px;
      height: 56px;
      background: var(--gold-soft);
      margin: 0 auto;
      display: none
    }

    @media(min-width:760px) {
      .fam {
        grid-template-columns: 1fr 1px 1fr;
        gap: 48px;
        align-items: start
      }

      .fam .sep {
        display: block;
        height: 100%;
        min-height: 200px
      }
    }

    .comp {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      font-family: var(--serif);
      font-size: clamp(1.05rem, 4.3vw, 1.35rem);
      line-height: 1.9
    }

    .comp span {
      padding: 0 clamp(10px, 3vw, 20px);
      white-space: nowrap
    }

    .comp span+span {
      border-left: 1px solid var(--gold-soft)
    }

    .foot {
      padding: 48px 24px 56px;
      text-align: center;
      border-top: 1px solid var(--gold-soft)
    }

    .foot .serif {
      font-size: 1.4rem;
      letter-spacing: .2em
    }

    @media(prefers-reduced-motion:reduce) {

      .seq,
      .r,
      .line-x {
        animation: none;
        transition: none;
        opacity: 1;
        transform: none
      }

      html {
        scroll-behavior: auto
      }
    }
  </style>
</head>

<body>
  <audio id="wedding-audio" loop preload="auto">
    <source src="/music/song.mp3" type="audio/mpeg">
    <source src="music/song.mp3" type="audio/mpeg">

  </audio>
  <main id="app"></main>
  <footer class="foot">
    <div class="serif" id="fmono"></div>
    <div class="small" style="margin-top:8px" id="fdate"></div>
  </footer>

  <script>
        /* ===== Central wedding data — edit here only ===== */
    const W = {
      groom: "Thouseef",
      bride: "Parveen",
      groomFirst: "Thouseef",
      brideFirst: "Parveen",
      groomFull: "Thouseef Roshan",
      brideFull: "Asna Parveen",
      monogram: "",
      footMono: "",
      short: "Thouseef & Parveen",
      date: {
        full: "19 November 2026",
        day: "Thursday",
        num: "19",
        month: "November 2026",
        dots: "19 • 11 • 2026",
        dotted: "19.11.2026",
        malayalam: ""
      },
      time: "5:00 PM – 8:00 PM",
      reception: "5:00 PM – 8:00 PM",
      notice: "",
      venue: {
        name: "Keyath Garden",
        place: "Mariyad, Manjeri",
        address: "Keyath Garden, Mariyad, Manjeri",
        map: "https://maps.app.goo.gl/2ZMnAs8cAJSCfr2y8?g_st=ic"
      },
      tagline: "A celebration of love, family & togetherness",
      quotes: [
        "Our love began as a story, and today we make a promise to turn it into forever.",
        "A beautiful marriage is not something you find, it is something you build together."
      ],
      invite: "We cordially invite your gracious presence and blessings on the auspicious occasion of the wedding ceremony of Thouseef & Parveen.",
      families: [
        {
          title: "Groom's Parents",
          names: "Kamarudheen & Jameela",
          lines: []
        },
        {
          title: "Bride's Parents",
          names: "Zainudheen & Asmabi",
          lines: []
        }
      ],
      compliments: []
    };
    const PHOTOS = {
      a: "/couple.jpg",
      b: "/couple.jpg",
      casual: "/image.png"
    };

    /* ===== Render ===== */
    const orn = '<svg class="orn r" viewBox="0 0 150 18" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M0 9h55M95 9h55"/><circle cx="75" cy="9" r="4"/><circle cx="65" cy="9" r="2.5"/><circle cx="85" cy="9" r="2.5"/></svg>';
    const pin = '<svg class="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0114 0C19 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></svg>';
    const D = W.date, V = W.venue;
    document.getElementById('app').innerHTML = `
<section id="hero">
  <div class="hero-bg">
    <img src="${PHOTOS.b}" alt="${W.short}" decoding="async">
  </div>
  <div class="hero-overlay"></div>
  <div class="hero-border"></div>
  <div class="hero-border-inner"></div>

  <div class="hero-top">
    <div class="hero-invitation-label seq" style="--i:0">Wedding Invitation</div>
  </div>

  <div class="hero-bottom">
    <h1 class="hero-names seq" style="--i:1">
      <span>${W.groomFirst}</span><span class="amp">&amp;</span><span>${W.brideFirst}</span>
    </h1>
    <div class="hero-date seq" style="--i:2">${D.full} • ${D.day}</div>
    <div class="hero-venue seq" style="--i:3">${V.name}, ${V.place}</div>
    <a class="btn hero-btn seq" style="--i:4" href="#intro">Open Invitation</a>
  </div>
</section>

<section id="intro">
  <div class="cover r"><img src="${PHOTOS.a}" alt="${W.short}" decoding="async"></div>
  <div class="wrap">
    <p class="label r">Together with their families</p>
    <h2 class="intro-names r" aria-label="${W.groomFull} & ${W.brideFull}">
      <div class="script-line script-groom">
        <span class="script-text">${W.groom}</span>
        <span class="calligraphy-spark" aria-hidden="true"></span>
      </div>
      <div class="script-line script-amp" aria-hidden="true">
        <span class="amp">&amp;</span>
      </div>
      <div class="script-line script-bride">
        <span class="script-text">${W.bride}</span>
        <span class="calligraphy-spark" aria-hidden="true"></span>
      </div>
      <div class="flourish-wrap" aria-hidden="true">
        <svg class="calligraphy-flourish" viewBox="0 0 280 26" fill="none" preserveAspectRatio="none">
          <path class="flourish-path" d="M14,14 C65,4 105,6 140,16 C175,24 215,10 266,8" stroke="url(#goldFlourishGrad)" stroke-width="2.2" stroke-linecap="round" />
          <defs>
            <linearGradient id="goldFlourishGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="rgba(220, 201, 160, 0.2)" />
              <stop offset="35%" stop-color="rgba(184, 152, 90, 0.95)" />
              <stop offset="70%" stop-color="rgba(218, 165, 32, 0.95)" />
              <stop offset="100%" stop-color="rgba(220, 201, 160, 0.2)" />
            </linearGradient>
          </defs>
        </svg>
      </div>
    </h2>
    <p class="small r" style="letter-spacing:.2em;text-transform:uppercase;margin:8px 0 16px;color:var(--gold,#b8985a);font-size:0.9rem">${W.groomFull} &amp; ${W.brideFull}</p>
    ${orn}
    <p class="quote r">“${W.quotes[0]}”</p>
  </div>
</section>

<section class="married-section">
  <div class="wrap" style="max-width:920px">
    <div class="married-card r">
      <div class="married-slider" id="marriedSlider" role="region" aria-label="Couple Photos" title="Click to view next photo">
        <div class="married-slide active">
          <img src="/couple.jpg" alt="${W.groomFull} & ${W.brideFull} — Wedding Attire" decoding="async">
        </div>
        <div class="married-slide">
          <img src="/image.png" alt="${W.groomFull} & ${W.brideFull} — Casual Moments" decoding="async">
        </div>
      </div>

      <div class="married-details">
        <p class="married-label">ARE GETTING MARRIED</p>
        <h2 class="married-name">${W.groomFull}</h2>
        <span class="married-amp">&amp;</span>
        <h2 class="married-name">${W.brideFull}</h2>
      </div>
    </div>
  </div>
</section>

<section class="alt"><div class="wrap">
  <p class="label r">The wedding day</p>
  <div class="daynum r">${D.num}</div>
  <div class="month r">${D.month.toUpperCase()}</div>
  <div class="day r" style="margin-top:10px">${D.day}</div>
  <div class="rule line-x r"></div>
  <div class="time r">${W.time}</div>
  ${D.malayalam ? `<div class="small r" style="margin-top:6px">${D.malayalam}</div>` : ''}

  <div class="countdown-wrap r" id="weddingCountdown" role="timer" aria-label="Wedding Countdown">
    <div class="countdown-item">
      <span class="countdown-num" id="cd-days">00</span>
      <span class="countdown-unit">Days</span>
    </div>
    <div class="countdown-sep">:</div>
    <div class="countdown-item">
      <span class="countdown-num" id="cd-hours">00</span>
      <span class="countdown-unit">Hours</span>
    </div>
    <div class="countdown-sep">:</div>
    <div class="countdown-item">
      <span class="countdown-num" id="cd-minutes">00</span>
      <span class="countdown-unit">Mins</span>
    </div>
    <div class="countdown-sep">:</div>
    <div class="countdown-item">
      <span class="countdown-num" id="cd-seconds">00</span>
      <span class="countdown-unit">Secs</span>
    </div>
  </div>
</div></section>

<section><div class="wrap">
  <p class="label r">The venue</p>
  <div class="r">${pin}</div>
  <h2 class="big r">${V.name}</h2>
  <p class="small r" style="margin-top:10px;font-size:1.05rem;line-height:1.6">${V.address}</p>
  <div class="r" style="margin-top:22px">
    <a class="btn" href="${V.map}" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:8px">
      ${pin}
      <span>Open in Google Maps</span>
    </a>
  </div>
</div></section>

<section class="alt"><div class="wrap">
  <p class="label r">Wedding &amp; Reception</p>
  <h2 class="big r" style="font-size:clamp(1.9rem,6vw,2.6rem)">${W.time}</h2>
  <div class="rule line-x r"></div>
  <p class="note r">${D.full} • ${D.day}</p>
</div></section>

<section><div class="wrap">
  ${orn}
  <p class="body r">${W.invite}</p>
  ${orn}
</div></section>

<section class="alt"><div class="wrap" style="max-width:900px">
  <p class="label r">With the blessings of our families</p>
  <div class="fam">
    ${fam(W.families[0])}
    <div class="sep line-x"></div>
    ${fam(W.families[1])}
  </div>
</div></section>

<section style="background:linear-gradient(180deg,var(--ivory),var(--blush) 55%,var(--ivory))"><div class="wrap">
  <div class="rule line-x r" style="margin-top:0"></div>
  <p class="quote r">“${W.quotes[1]}”</p>
  <div class="rule line-x r"></div>
</div></section>

<section><div class="wrap" style="max-width:640px">
  <div class="gal" style="grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px;">
    <div class="ph ga r" style="aspect-ratio:2/3;border-radius:14px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,0.12)">
      <img src="${PHOTOS.a}" alt="${W.groomFull} &amp; ${W.brideFull} — Wedding Attire" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:cover;object-position:center 20%">
    </div>
    ${PHOTOS.casual ? `
    <div class="ph gb r" style="aspect-ratio:2/3;border-radius:14px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,0.12)">
      <img src="${PHOTOS.casual}" alt="${W.groomFull} &amp; ${W.brideFull}" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:cover;object-position:center 20%">
    </div>` : ''}
  </div>
</div></section>

${W.compliments && W.compliments.length ? `
<section><div class="wrap">
  <p class="label r">Best compliments from</p>
  <div class="comp r">${W.compliments.map(n => `<span>${n}</span>`).join('')}</div>
</div></section>` : ''}

<section style="padding-block:clamp(100px,22vw,200px)"><div class="wrap">
  <h2 class="names r" style="font-size:clamp(2.2rem,9vw,3.4rem)">${W.short}</h2>
  <p class="serif r" style="font-size:1.4rem;letter-spacing:.2em;margin-top:24px">${D.dots}</p>
  <div class="rule line-x r"></div>
  <p class="quote r">Together, forever begins here.</p>
  <p class="small r" style="margin-top:28px">With love and blessings</p>
  ${orn}
</div></section>`;

    function fam(f) {
      const linesHtml = f.lines && f.lines.length ? `<p style="margin-top:6px">${f.lines.join('<br>')}</p>` : '';
      return `<div class="r">
  <p class="label">${f.title}</p>
  <h3 style="font-size:clamp(1.3rem,4.5vw,1.75rem);line-height:1.4">${f.names}</h3>
  ${linesHtml}
</div>`;
    }
    document.getElementById('fmono').textContent = W.footMono;
    document.getElementById('fdate').textContent = D.dotted;

    /* ===== Scroll reveal ===== */
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) } }), { threshold: .15, rootMargin: '0px 0px -6% 0px' });

    /* ===== Prelude: guest taps Open Invitation to enter ===== */
    history.scrollRestoration = 'manual'; scrollTo(0, 0);
    document.documentElement.style.overflow = 'hidden'; document.body.style.overflow = 'hidden';
    let opened = false;
    function openInvite() {
      if (opened) return; opened = true;
      document.documentElement.style.overflow = ''; document.body.style.overflow = '';
      scrollTo(0, 0);
      document.getElementById('hero').classList.add('leaving');
      document.querySelectorAll('.r').forEach(el => io.observe(el));
      playAudio();
      setTimeout(() => {
        const inames = document.querySelector('.intro-names');
        if (inames) inames.classList.add('in');
      }, 450);
    }
    document.querySelector('#hero .btn').addEventListener('click', e => { e.preventDefault(); openInvite() });

        /* ===== Normal Smooth Image Transition ===== */
    function initSlider() {
      const slider = document.getElementById('marriedSlider');
      if (!slider) return;
      const slides = slider.querySelectorAll('.married-slide');
      let currentIdx = 0;
      let timer = null;

      function goTo(newIdx) {
        if (newIdx === currentIdx || newIdx < 0 || newIdx >= slides.length) return;
        slides.forEach((s, i) => s.classList.toggle('active', i === newIdx));
        currentIdx = newIdx;
      }

      function next() {
        const nextIdx = (currentIdx + 1) % slides.length;
        goTo(nextIdx);
      }

      function startAuto() {
        stopAuto();
        timer = setInterval(next, 5500);
      }

      function stopAuto() {
        if (timer) clearInterval(timer);
      }

      slider.addEventListener('click', () => {
        next();
        startAuto();
      });

      slider.addEventListener('mouseenter', stopAuto);
      slider.addEventListener('mouseleave', startAuto);

      startAuto();
    }
    initSlider();

    /* ===== Wedding Countdown Timer ===== */
    function initCountdown() {
      const target = new Date('2026-11-19T17:00:00+05:30').getTime();
      const elDays = document.getElementById('cd-days');
      const elHours = document.getElementById('cd-hours');
      const elMins = document.getElementById('cd-minutes');
      const elSecs = document.getElementById('cd-seconds');
      if (!elDays || !elHours || !elMins || !elSecs) return;

      function update() {
        const now = Date.now();
        const diff = Math.max(0, target - now);

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((diff % (1000 * 60)) / 1000);

        elDays.textContent = String(days).padStart(2, '0');
        elHours.textContent = String(hours).padStart(2, '0');
        elMins.textContent = String(mins).padStart(2, '0');
        elSecs.textContent = String(secs).padStart(2, '0');
      }

      update();
      setInterval(update, 1000);
    }
    initCountdown();

    /* ===== Background Music Playback ===== */
    const audio = document.getElementById('wedding-audio');
    if (audio) audio.volume = 0.4;

    function playAudio() {
      if (!audio) return;
      audio.volume = 0.4;
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch(err => {
          console.log("Audio waiting for user gesture:", err);
          const resume = () => {
            audio.play().catch(() => { });
            window.removeEventListener('click', resume);
            window.removeEventListener('touchstart', resume);
          };
          window.addEventListener('click', resume, { once: true });
          window.addEventListener('touchstart', resume, { once: true });
        });
      }
    }
  </script>
</body>

</html>
